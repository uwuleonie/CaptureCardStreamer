# Builds CaptureCardStreamer.exe on a Windows runner and packs it into a
# single setup file (Inno Setup). Download it from the run's "Artifacts".
name: Build Windows installer

on:
  push:
    branches: [main]
    # Pushing a tag like v0.1.14 also publishes a GitHub Release with the
    # setup file and a portable exe attached.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build exe and installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Check exe does not need the VC++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\vicash.exe
          $deps
          if ($deps -match "VCRUNTIME|api-ms-win-crt") { throw "exe still depends on the VC++ runtime" }

      - name: Add portable exe
        shell: pwsh
        run: Copy-Item target\release\vicash.exe target\installer\CaptureCardStreamer-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CaptureCardStreamer-Setup
          path: target/installer/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CaptureCardStreamer ${{ github.ref_name }}
          files: target/installer/*.exe
          body: |
            **Download:** `CaptureCardStreamer-Setup-*.exe` herunterladen und per Doppelklick installieren.
            Alternativ `CaptureCardStreamer-portable.exe`: startet direkt ohne Installation.

            Falls Windows "Der Computer wurde durch Windows geschuetzt" zeigt: auf "Weitere Informationen" und dann "Trotzdem ausfuehren" klicken (die Datei ist nicht signiert).

            Basiert auf [vicash](https://github.com/caaatto/vicash) von caaatto (MIT-Lizenz), angepasst fuer Windows 10.
